<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <defs>
    <style>
      .icon-circle { fill: #ffffff; stroke: #333333; stroke-width: 2; }
      .icon-circle-highlight { fill: #fef3c7; stroke: #333333; stroke-width: 2; }
      .icon-circle-admin { fill: #fee2e2; stroke: #333333; stroke-width: 2; }
      .icon-circle-success { fill: #dcfce7; stroke: #333333; stroke-width: 2; }
      .icon-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #333333; }
      .title-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #333333; }
      .caption-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #333333; text-decoration: underline; }
      .section-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #666666; }
      .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="580" fill="#ffffff"/>
  
  <!-- ===== MAIN ENTRY ROW ===== -->
  
  <!-- Admin Icon -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="28" class="icon-circle-admin"/>
    <circle cx="0" cy="-8" r="9" fill="#333"/>
    <path d="M-14,14 Q0,2 14,14" stroke="#333" stroke-width="3" fill="none"/>
    <circle cx="10" cy="-10" r="6" fill="#ef4444"/>
    <text x="10" y="-7" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">★</text>
    <text x="0" y="48" class="icon-text" font-weight="bold">Admin</text>
  </g>
  
  <!-- Arrow -->
  <line x1="98" y1="100" x2="138" y2="100" class="arrow"/>
  
  <!-- Login Icon -->
  <g transform="translate(175, 100)">
    <circle cx="0" cy="0" r="25" class="icon-circle"/>
    <rect x="-10" y="-12" width="20" height="14" rx="2" fill="#333"/>
    <circle cx="0" cy="7" r="6" fill="none" stroke="#333" stroke-width="2"/>
    <text x="0" y="42" class="icon-text">Login</text>
  </g>
  
  <!-- Arrow -->
  <line x1="210" y1="100" x2="250" y2="100" class="arrow"/>
  
  <!-- Dashboard/Home Icon -->
  <g transform="translate(290, 100)">
    <circle cx="0" cy="0" r="28" class="icon-circle-highlight"/>
    <path d="M0,-16 L16,0 L16,16 L-16,16 L-16,0 Z" fill="#f59e0b"/>
    <rect x="-5" y="4" width="10" height="12" fill="#fff"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">Dashboard</text>
  </g>
  
  <!-- Section Label - Operator Features -->
  <text x="290" y="140" class="section-text">+ All Operator Pages</text>
  
  <!-- ===== ADMIN FEATURES BRANCHING ===== -->
  
  <!-- Arrow to User Management -->
  <path d="M318,100 L380,100" class="arrow"/>
  
  <!-- User Management Icon -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <circle cx="-7" cy="-5" r="6" fill="#333"/>
    <circle cx="7" cy="-5" r="6" fill="#333"/>
    <path d="M-14,10 Q-7,4 0,10" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M0,10 Q7,4 14,10" stroke="#333" stroke-width="2" fill="none"/>
    <text x="0" y="42" class="icon-text">User</text>
    <text x="0" y="52" class="icon-text">Management</text>
  </g>
  
  <!-- Arrow up from User Management to Add User -->
  <path d="M420,75 L420,45" class="arrow"/>
  
  <!-- Add User Icon -->
  <g transform="translate(420, 25)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <circle cx="0" cy="-3" r="5" fill="#333"/>
    <path d="M-7,8 Q0,3 7,8" stroke="#333" stroke-width="1.5" fill="none"/>
    <text x="10" y="-8" fill="#22c55e" font-size="14" font-weight="bold">+</text>
  </g>
  <text x="420" y="55" class="icon-text">Add User</text>
  
  <!-- Arrow right from User Management to Edit User -->
  <path d="M445,100 L485,100" class="arrow"/>
  
  <!-- Edit User Icon -->
  <g transform="translate(515, 100)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <circle cx="0" cy="-3" r="5" fill="#333"/>
    <path d="M-7,8 Q0,3 7,8" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M6,-8 L10,-4 L4,2 L0,-2 Z" fill="#333"/>
  </g>
  <text x="515" y="130" class="icon-text">Edit User</text>
  
  <!-- Arrow down from User Management to Disable User -->
  <path d="M420,125 L420,160" class="arrow"/>
  
  <!-- Disable User Icon -->
  <g transform="translate(420, 185)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <circle cx="0" cy="-3" r="5" fill="#333"/>
    <path d="M-7,8 Q0,3 7,8" stroke="#333" stroke-width="1.5" fill="none"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ef4444" stroke-width="3"/>
  </g>
  <text x="420" y="215" class="icon-text">Disable User</text>
  
  <!-- Arrow right from User Management to Reset Password -->
  <path d="M445,100 L485,130 L515,130" class="arrow"/>
  
  <!-- Reset Password Icon -->
  <g transform="translate(545, 155)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-6" y="-8" width="12" height="8" rx="2" fill="#333"/>
    <circle cx="0" cy="4" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M8,-6 L12,-2 L8,2" stroke="#333" stroke-width="1.5" fill="none"/>
  </g>
  <text x="545" y="185" class="icon-text">Reset</text>
  <text x="545" y="195" class="icon-text">Password</text>
  
  <!-- ===== BATCH MANAGEMENT ===== -->
  
  <!-- Arrow down from Dashboard to Batch Management -->
  <path d="M290,128 L290,260" class="arrow"/>
  
  <!-- Batch Management Icon -->
  <g transform="translate(290, 290)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#333" stroke-width="1.5"/>
    <line x1="-12" y1="4" x2="12" y2="4" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="42" class="icon-text">Batch</text>
    <text x="0" y="52" class="icon-text">Management</text>
  </g>
  
  <!-- Arrow left to Create Batch -->
  <path d="M265,290 L220,290" class="arrow"/>
  
  <!-- Create Batch Icon -->
  <g transform="translate(190, 290)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="4" fill="#22c55e" font-size="14" font-weight="bold">+</text>
  </g>
  <text x="190" y="320" class="icon-text">Create</text>
  <text x="190" y="330" class="icon-text">Batch</text>
  
  <!-- Arrow right to Edit Batch -->
  <path d="M315,290 L355,290" class="arrow"/>
  
  <!-- Edit Batch Icon -->
  <g transform="translate(385, 290)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M4,-6 L8,-2 L2,4 L-2,0 Z" fill="#333"/>
  </g>
  <text x="385" y="320" class="icon-text">Edit Batch</text>
  
  <!-- Arrow down to Close/Reopen Batch -->
  <path d="M290,315 L290,355" class="arrow"/>
  
  <!-- Close/Reopen Batch Icon -->
  <g transform="translate(290, 380)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <polyline points="-3,-2 0,2 5,-4" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>
  <text x="290" y="410" class="icon-text">Toggle</text>
  <text x="290" y="420" class="icon-text">Status</text>
  
  <!-- ===== QUALITY CONTROL ===== -->
  
  <!-- Arrow from Dashboard to Quality Control -->
  <path d="M290,128 L290,200 L500,200 L500,260" class="arrow"/>
  
  <!-- Quality Control Icon -->
  <g transform="translate(500, 290)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#333" stroke-width="2"/>
    <polyline points="-5,0 -2,4 7,-5" stroke="#22c55e" stroke-width="2.5" fill="none"/>
    <text x="0" y="42" class="icon-text">Quality</text>
    <text x="0" y="52" class="icon-text">Control</text>
  </g>
  
  <!-- Arrow to Flag Scan -->
  <path d="M525,290 L565,290" class="arrow"/>
  
  <!-- Flag Scan Icon -->
  <g transform="translate(595, 290)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-2" y="-8" width="2" height="16" fill="#333"/>
    <polygon points="0,-8 10,-4 0,0" fill="#ef4444"/>
  </g>
  <text x="595" y="320" class="icon-text">Flag Scan</text>
  
  <!-- Arrow down to Review Notes -->
  <path d="M500,315 L500,355" class="arrow"/>
  
  <!-- Review Notes Icon -->
  <g transform="translate(500, 380)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-8" width="14" height="16" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#333" stroke-width="1"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#333" stroke-width="1"/>
    <line x1="-4" y1="4" x2="2" y2="4" stroke="#333" stroke-width="1"/>
  </g>
  <text x="500" y="410" class="icon-text">Review</text>
  <text x="500" y="420" class="icon-text">Notes</text>
  
  <!-- Arrow right to Edit Scan Data -->
  <path d="M525,290 L565,260 L595,260" class="arrow"/>
  
  <!-- Edit Scan Data Icon -->
  <g transform="translate(625, 235)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M3,-5 L7,-1 L1,5 L-3,1 Z" fill="#333"/>
  </g>
  <text x="625" y="265" class="icon-text">Edit Scan</text>
  <text x="625" y="275" class="icon-text">Data</text>
  
  <!-- ===== ALL SCANS ===== -->
  
  <!-- Arrow from Dashboard to All Scans -->
  <path d="M290,128 L290,200 L700,200 L700,260" class="arrow"/>
  
  <!-- All Scans Icon -->
  <g transform="translate(700, 290)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <rect x="-12" y="-14" width="24" height="28" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="-7" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="-1" x2="7" y2="-1" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="5" x2="7" y2="5" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="42" class="icon-text">All Scans</text>
  </g>
  
  <!-- Arrow to Delete Scan -->
  <path d="M725,290 L765,290" class="arrow"/>
  
  <!-- Delete Scan Icon -->
  <g transform="translate(795, 290)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-6" y="-4" width="12" height="12" rx="1" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="-4" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="-3" y1="0" x2="-3" y2="5" stroke="#ef4444" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="#ef4444" stroke-width="1"/>
    <line x1="3" y1="0" x2="3" y2="5" stroke="#ef4444" stroke-width="1"/>
  </g>
  <text x="795" y="320" class="icon-text">Delete Scan</text>
  
  <!-- ===== ACTIVITY LOG ===== -->
  
  <!-- Arrow from Dashboard to Activity Log -->
  <path d="M290,128 L290,450 L100,450" class="arrow"/>
  
  <!-- Activity Log Icon -->
  <g transform="translate(70, 450)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <rect x="-12" y="-14" width="24" height="28" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-7" y1="-7" x2="7" y2="-7" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="-1" x2="4" y2="-1" stroke="#333" stroke-width="1.5"/>
    <circle cx="7" cy="5" r="3" fill="#333"/>
    <text x="0" y="42" class="icon-text">Activity Log</text>
  </g>
  
  <!-- Arrow to Filter Actions -->
  <path d="M70,475 L70,510" class="arrow"/>
  
  <!-- Filter Actions Icon -->
  <g transform="translate(70, 530)">
    <circle cx="0" cy="0" r="16" class="icon-circle"/>
    <polygon points="-7,-5 7,-5 2,2 2,7 -2,7 -2,2" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="70" y="558" class="icon-text">Filter</text>
  
  <!-- ===== SYSTEM CONFIG ===== -->
  
  <!-- Arrow from Dashboard to System Config -->
  <path d="M290,128 L290,450 L850,450" class="arrow"/>
  
  <!-- System Config Icon -->
  <g transform="translate(820, 450)">
    <circle cx="0" cy="0" r="25" class="icon-circle-admin"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <line x1="0" y1="-14" x2="0" y2="-10" stroke="#333" stroke-width="3"/>
    <line x1="0" y1="10" x2="0" y2="14" stroke="#333" stroke-width="3"/>
    <line x1="-14" y1="0" x2="-10" y2="0" stroke="#333" stroke-width="3"/>
    <line x1="10" y1="0" x2="14" y2="0" stroke="#333" stroke-width="3"/>
    <text x="0" y="42" class="icon-text">System</text>
    <text x="0" y="52" class="icon-text">Config</text>
  </g>
  
  <!-- Config sub-features -->
  <!-- Camera Config -->
  <path d="M820,425 L820,390 L760,390" class="arrow"/>
  <g transform="translate(735, 390)">
    <circle cx="0" cy="0" r="16" class="icon-circle"/>
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#333"/>
  </g>
  <text x="735" y="418" class="icon-text">Camera</text>
  
  <!-- AI Settings -->
  <path d="M795,450 L760,450" class="arrow"/>
  <g transform="translate(735, 450)">
    <circle cx="0" cy="0" r="16" class="icon-circle"/>
    <text x="0" y="4" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">AI</text>
  </g>
  <text x="735" y="478" class="icon-text">AI Settings</text>
  
  <!-- Data Storage -->
  <path d="M820,475 L820,510 L760,510" class="arrow"/>
  <g transform="translate(735, 510)">
    <circle cx="0" cy="0" r="16" class="icon-circle"/>
    <ellipse cx="0" cy="-4" rx="8" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M-8,-4 L-8,4 Q0,10 8,4 L8,-4" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="735" y="538" class="icon-text">Storage</text>
  
  <!-- System Power -->
  <path d="M845,450 L870,450" class="arrow"/>
  <g transform="translate(855, 420)">
    <circle cx="0" cy="0" r="16" class="icon-circle"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#333" stroke-width="2"/>
  </g>
  <text x="855" y="448" class="icon-text">Power</text>
  
  <!-- ===== LEGEND ===== -->
  <g transform="translate(560, 420)">
    <rect x="0" y="0" width="160" height="55" fill="#f9f9f9" stroke="#ddd" rx="5"/>
    <text x="80" y="16" class="icon-text" font-weight="bold">Legend</text>
    <circle cx="20" cy="33" r="8" fill="#fee2e2" stroke="#333" stroke-width="1"/>
    <text x="35" y="36" class="icon-text" text-anchor="start" font-size="9">Admin Features</text>
    <circle cx="100" cy="33" r="8" fill="#fef3c7" stroke="#333" stroke-width="1"/>
    <text x="115" y="36" class="icon-text" text-anchor="start" font-size="9">Main</text>
  </g>
  
  <!-- ===== CAPTION ===== -->
  <text x="450" y="565" class="caption-text">Figure 13: Program Workflow for BananaVision – Admin (Web)</text>
  
</svg>
