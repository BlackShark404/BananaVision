<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <style>
      .icon-circle { fill: #ffffff; stroke: #333333; stroke-width: 2; }
      .icon-circle-highlight { fill: #fef3c7; stroke: #333333; stroke-width: 2; }
      .icon-circle-success { fill: #dcfce7; stroke: #333333; stroke-width: 2; }
      .icon-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #333333; }
      .title-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #333333; }
      .caption-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #333333; text-decoration: underline; }
      .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="500" fill="#ffffff"/>
  
  <!-- ===== MAIN FLOW ROW ===== -->
  
  <!-- Operator Icon -->
  <g transform="translate(60, 150)">
    <circle cx="0" cy="0" r="28" class="icon-circle"/>
    <circle cx="0" cy="-8" r="9" fill="#333"/>
    <path d="M-14,14 Q0,2 14,14" stroke="#333" stroke-width="3" fill="none"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">Operator</text>
  </g>
  
  <!-- Arrow -->
  <line x1="98" y1="150" x2="138" y2="150" class="arrow"/>
  
  <!-- Login Icon -->
  <g transform="translate(175, 150)">
    <circle cx="0" cy="0" r="25" class="icon-circle"/>
    <rect x="-10" y="-12" width="20" height="14" rx="2" fill="#333"/>
    <circle cx="0" cy="7" r="6" fill="none" stroke="#333" stroke-width="2"/>
    <text x="0" y="42" class="icon-text">Login</text>
  </g>
  
  <!-- Arrow -->
  <line x1="210" y1="150" x2="250" y2="150" class="arrow"/>
  
  <!-- Dashboard/Home Icon -->
  <g transform="translate(290, 150)">
    <circle cx="0" cy="0" r="28" class="icon-circle-highlight"/>
    <path d="M0,-16 L16,0 L16,16 L-16,16 L-16,0 Z" fill="#f59e0b"/>
    <rect x="-5" y="4" width="10" height="12" fill="#fff"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">Dashboard</text>
    <text x="0" y="60" class="icon-text">(Home)</text>
  </g>
  
  <!-- Arrow to Select Batch -->
  <line x1="328" y1="150" x2="368" y2="150" class="arrow"/>
  
  <!-- Select Batch Icon -->
  <g transform="translate(405, 150)">
    <circle cx="0" cy="0" r="25" class="icon-circle"/>
    <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <polyline points="-6,0 -2,5 8,-5" stroke="#333" stroke-width="2.5" fill="none"/>
    <text x="0" y="42" class="icon-text">Select Batch</text>
  </g>
  
  <!-- Arrow to Scan -->
  <line x1="440" y1="150" x2="480" y2="150" class="arrow"/>
  
  <!-- Scan Now Icon -->
  <g transform="translate(520, 150)">
    <circle cx="0" cy="0" r="28" class="icon-circle-highlight"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#333"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">Scan Now</text>
  </g>
  
  <!-- Arrow to View Result -->
  <line x1="558" y1="150" x2="598" y2="150" class="arrow"/>
  
  <!-- View Result Icon -->
  <g transform="translate(640, 150)">
    <circle cx="0" cy="0" r="28" class="icon-circle-success"/>
    <polyline points="-10,-2 -4,6 12,-8" stroke="#22c55e" stroke-width="4" fill="none"/>
    <text x="0" y="48" class="icon-text">View Scan</text>
    <text x="0" y="60" class="icon-text">Result</text>
  </g>
  
  <!-- Arrow to Kiosk -->
  <path d="M640,122 L640,70 L780,70" class="arrow"/>
  
  <!-- Kiosk Mode Icon -->
  <g transform="translate(780, 70)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <rect x="-12" y="-10" width="24" height="16" rx="2" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-6" y1="10" x2="6" y2="10" stroke="#333" stroke-width="2"/>
    <text x="0" y="38" class="icon-text">Launch Kiosk</text>
  </g>
  
  <!-- ===== FEATURES BRANCHING FROM DASHBOARD ===== -->
  
  <!-- Arrow up to View Profile -->
  <path d="M290,122 L290,70" class="arrow"/>
  
  <!-- View Profile Icon -->
  <g transform="translate(290, 45)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <circle cx="0" cy="-6" r="6" fill="#333"/>
    <path d="M-10,10 Q0,2 10,10" stroke="#333" stroke-width="2" fill="none"/>
    <text x="0" y="38" class="icon-text">View Profile</text>
  </g>
  
  <!-- Arrow from Profile to Update Password -->
  <path d="M268,45 L220,45" class="arrow"/>
  
  <!-- Update Password Icon -->
  <g transform="translate(190, 45)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-10" width="14" height="10" rx="2" fill="#333"/>
    <circle cx="0" cy="5" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="190" y="75" class="icon-text">Update</text>
  <text x="190" y="85" class="icon-text">Password</text>
  
  <!-- Arrow from Profile to Theme -->
  <path d="M312,45 L360,45" class="arrow"/>
  
  <!-- Theme Toggle Icon -->
  <g transform="translate(390, 45)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <circle cx="-3" cy="0" r="7" fill="#333"/>
    <path d="M4,-7 Q12,0 4,7" fill="#fff" stroke="#333" stroke-width="1"/>
  </g>
  <text x="390" y="75" class="icon-text">Theme</text>
  <text x="390" y="85" class="icon-text">Toggle</text>
  
  <!-- ===== BOTTOM ROW FEATURES ===== -->
  
  <!-- Arrow down to Scan Logs -->
  <path d="M290,178 L290,240 L150,240" class="arrow"/>
  
  <!-- Scan Logs Icon -->
  <g transform="translate(115, 240)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#333" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-6" y1="6" x2="6" y2="6" stroke="#333" stroke-width="2"/>
    <text x="0" y="40" class="icon-text">Scan Logs</text>
  </g>
  
  <!-- Arrow from Scan Logs to View Detail -->
  <path d="M115,262 L115,310" class="arrow"/>
  
  <!-- View Detail Icon -->
  <g transform="translate(115, 340)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-8" y="-10" width="16" height="20" rx="2" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="4" cy="-4" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="115" y="370" class="icon-text">View Detail</text>
  
  <!-- Arrow from Scan Logs to Export -->
  <path d="M93,240 L50,240" class="arrow"/>
  
  <!-- Export CSV Icon -->
  <g transform="translate(30, 240)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-7" y="-8" width="14" height="16" rx="1" fill="none" stroke="#333" stroke-width="2"/>
    <polyline points="-4,-2 0,3 4,-2" stroke="#333" stroke-width="2" fill="none"/>
  </g>
  <text x="30" y="270" class="icon-text">Export CSV</text>
  
  <!-- Arrow to Analytics -->
  <path d="M290,178 L290,320 L250,320" class="arrow"/>
  
  <!-- Analytics Icon -->
  <g transform="translate(215, 320)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <rect x="-12" y="6" width="6" height="6" fill="#333"/>
    <rect x="-3" y="-2" width="6" height="14" fill="#333"/>
    <rect x="6" y="-8" width="6" height="20" fill="#333"/>
    <text x="0" y="40" class="icon-text">Analytics</text>
  </g>
  
  <!-- Arrow to Inventory -->
  <path d="M290,178 L290,320 L340,320" class="arrow"/>
  
  <!-- Inventory Icon -->
  <g transform="translate(375, 320)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <rect x="-12" y="-8" width="24" height="18" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#333" stroke-width="2"/>
    <text x="0" y="40" class="icon-text">Inventory</text>
  </g>
  
  <!-- Arrow from Inventory to FIFO -->
  <path d="M375,342 L375,390" class="arrow"/>
  
  <!-- FIFO Icon -->
  <g transform="translate(375, 420)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <text x="0" y="4" font-size="8" text-anchor="middle" fill="#333" font-weight="bold">FIFO</text>
  </g>
  <text x="375" y="450" class="icon-text">FIFO List</text>
  
  <!-- Arrow from Inventory to Spoilage -->
  <path d="M397,320 L450,320" class="arrow"/>
  
  <!-- Spoilage Alert Icon -->
  <g transform="translate(480, 320)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <polygon points="0,-10 10,8 -10,8" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="3" font-size="10" text-anchor="middle" fill="#ef4444" font-weight="bold">!</text>
  </g>
  <text x="480" y="350" class="icon-text">Spoilage</text>
  <text x="480" y="360" class="icon-text">Alerts</text>
  
  <!-- Arrow to Device Status -->
  <path d="M290,178 L290,420 L540,420" class="arrow"/>
  
  <!-- Device Status Icon -->
  <g transform="translate(575, 420)">
    <circle cx="0" cy="0" r="22" class="icon-circle"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#22c55e"/>
    <line x1="0" y1="-14" x2="0" y2="-10" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="14" stroke="#333" stroke-width="2"/>
    <text x="0" y="40" class="icon-text">Device Status</text>
  </g>
  
  <!-- Arrow from Device Status to Camera Grid -->
  <path d="M597,420 L650,420" class="arrow"/>
  
  <!-- Camera Grid Icon -->
  <g transform="translate(680, 420)">
    <circle cx="0" cy="0" r="18" class="icon-circle"/>
    <rect x="-10" y="-8" width="8" height="6" rx="1" fill="#333"/>
    <rect x="2" y="-8" width="8" height="6" rx="1" fill="#333"/>
    <rect x="-10" y="2" width="8" height="6" rx="1" fill="#22c55e"/>
    <rect x="2" y="2" width="8" height="6" rx="1" fill="#ef4444"/>
  </g>
  <text x="680" y="450" class="icon-text">4-Camera</text>
  <text x="680" y="460" class="icon-text">Grid</text>
  
  <!-- Arrow from Device to System Info -->
  <path d="M575,442 L575,470" class="arrow"/>
  
  <!-- System Info Icon -->
  <g transform="translate(575, 480)">
    <circle cx="0" cy="0" r="14" class="icon-circle"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#333" stroke-width="1"/>
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- ===== SCANNING PIPELINE DETAIL ===== -->
  
  <!-- Pipeline box -->
  <rect x="420" y="195" width="280" height="70" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="560" y="212" class="icon-text" font-weight="bold">AI Scanning Pipeline</text>
  
  <!-- Capturing -->
  <g transform="translate(450, 240)">
    <circle cx="0" cy="0" r="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#333"/>
  </g>
  <text x="450" y="268" class="icon-text" font-size="8">Capturing</text>
  
  <line x1="470" y1="240" x2="505" y2="240" class="arrow"/>
  
  <!-- Detecting -->
  <g transform="translate(530, 240)">
    <circle cx="0" cy="0" r="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="4" y1="4" x2="10" y2="10" stroke="#333" stroke-width="2"/>
  </g>
  <text x="530" y="268" class="icon-text" font-size="8">Detecting</text>
  
  <line x1="550" y1="240" x2="585" y2="240" class="arrow"/>
  
  <!-- Analyzing -->
  <g transform="translate(610, 240)">
    <circle cx="0" cy="0" r="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="610" y="268" class="icon-text" font-size="8">Analyzing</text>
  
  <line x1="630" y1="240" x2="665" y2="240" class="arrow"/>
  
  <!-- Result -->
  <g transform="translate(680, 240)">
    <circle cx="0" cy="0" r="16" fill="#dcfce7" stroke="#333" stroke-width="1.5"/>
    <polyline points="-5,0 -2,4 6,-4" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>
  <text x="680" y="268" class="icon-text" font-size="8">Result</text>
  
  <!-- ===== LEGEND ===== -->
  <g transform="translate(650, 320)">
    <rect x="0" y="0" width="180" height="75" fill="#f9f9f9" stroke="#ddd" rx="5"/>
    <text x="90" y="18" class="icon-text" font-weight="bold">Legend</text>
    <circle cx="20" cy="35" r="8" fill="#fef3c7" stroke="#333" stroke-width="1"/>
    <text x="35" y="38" class="icon-text" text-anchor="start" font-size="9">Main Actions</text>
    <circle cx="100" cy="35" r="8" fill="#dcfce7" stroke="#333" stroke-width="1"/>
    <text x="115" y="38" class="icon-text" text-anchor="start" font-size="9">Success/Result</text>
    <circle cx="20" cy="55" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <text x="35" y="58" class="icon-text" text-anchor="start" font-size="9">Features</text>
  </g>
  
  <!-- ===== CAPTION ===== -->
  <text x="425" y="490" class="caption-text">Figure 12: Program Workflow for Operator – Web/Kiosk</text>
  
</svg>
