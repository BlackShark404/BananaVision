<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      .icon-circle { fill: #ffffff; stroke: #333333; stroke-width: 2; }
      .icon-circle-hardware { fill: #dbeafe; stroke: #333333; stroke-width: 2; }
      .icon-circle-ai { fill: #fce7f3; stroke: #333333; stroke-width: 2; }
      .icon-circle-success { fill: #dcfce7; stroke: #333333; stroke-width: 2; }
      .icon-circle-data { fill: #fef3c7; stroke: #333333; stroke-width: 2; }
      .icon-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; fill: #333333; }
      .title-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #333333; }
      .caption-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; fill: #333333; text-decoration: underline; }
      .section-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #666666; }
      .arrow { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-thick { stroke: #333333; stroke-width: 3; fill: none; marker-end: url(#arrowhead-thick); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="arrowhead-thick" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#ffffff"/>
  
  <!-- Section Labels -->
  <text x="450" y="25" class="section-text" text-anchor="middle">━━━━━━━━━━  HARDWARE LAYER  ━━━━━━━━━━</text>
  
  <!-- ===== TRIGGER ROW ===== -->
  
  <!-- User Trigger Scan -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="28" class="icon-circle"/>
    <circle cx="0" cy="-8" r="9" fill="#333"/>
    <path d="M-14,14 Q0,2 14,14" stroke="#333" stroke-width="3" fill="none"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">User Triggers</text>
    <text x="0" y="60" class="icon-text">Scan</text>
  </g>
  
  <!-- Arrow -->
  <line x1="118" y1="80" x2="168" y2="80" class="arrow-thick"/>
  
  <!-- Mini PC Icon -->
  <g transform="translate(210, 80)">
    <circle cx="0" cy="0" r="30" class="icon-circle-hardware"/>
    <rect x="-18" y="-12" width="36" height="24" rx="4" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="-12" y="-6" width="14" height="2" fill="#333"/>
    <rect x="-12" y="-2" width="14" height="2" fill="#333"/>
    <circle cx="11" cy="0" r="2.5" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="-16" y1="14" x2="16" y2="14" stroke="#333" stroke-width="2"/>
    <text x="0" y="50" class="icon-text" font-weight="bold">Mini PC</text>
    <text x="0" y="62" class="icon-text">(Controller)</text>
  </g>
  
  <!-- Arrow to Camera Array -->
  <line x1="250" y1="80" x2="300" y2="80" class="arrow-thick"/>
  
  <!-- ===== 4-CAMERA ARRAY ===== -->
  
  <!-- Camera Array Box -->
  <rect x="310" y="40" width="200" height="90" rx="10" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="58" class="icon-text" font-weight="bold" fill="#3b82f6">4-Camera Sequential Capture</text>
  
  <!-- Camera 1 -->
  <g transform="translate(345, 95)">
    <circle cx="0" cy="0" r="18" class="icon-circle-hardware"/>
    <rect x="-10" y="-6" width="20" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="0" y="28" class="icon-text">Cam 1</text>
  </g>
  
  <!-- Camera 2 -->
  <g transform="translate(395, 95)">
    <circle cx="0" cy="0" r="18" class="icon-circle-hardware"/>
    <rect x="-10" y="-6" width="20" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="0" y="28" class="icon-text">Cam 2</text>
  </g>
  
  <!-- Camera 3 -->
  <g transform="translate(445, 95)">
    <circle cx="0" cy="0" r="18" class="icon-circle-hardware"/>
    <rect x="-10" y="-6" width="20" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="0" y="28" class="icon-text">Cam 3</text>
  </g>
  
  <!-- Camera 4 -->
  <g transform="translate(490, 95)">
    <circle cx="0" cy="0" r="18" class="icon-circle-hardware"/>
    <rect x="-10" y="-6" width="20" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#333"/>
    <text x="0" y="28" class="icon-text">Cam 4</text>
  </g>
  
  <!-- Arrow to Capture Images -->
  <line x1="520" y1="80" x2="570" y2="80" class="arrow-thick"/>
  
  <!-- Capture Images Icon -->
  <g transform="translate(610, 80)">
    <circle cx="0" cy="0" r="28" class="icon-circle-hardware"/>
    <rect x="-16" y="-12" width="14" height="10" rx="1" fill="#333"/>
    <rect x="2" y="-12" width="14" height="10" rx="1" fill="#333"/>
    <rect x="-16" y="2" width="14" height="10" rx="1" fill="#333"/>
    <rect x="2" y="2" width="14" height="10" rx="1" fill="#333"/>
    <text x="0" y="48" class="icon-text">Capture</text>
    <text x="0" y="60" class="icon-text">4 Images</text>
  </g>
  
  <!-- Arrow to Image Buffer -->
  <line x1="648" y1="80" x2="698" y2="80" class="arrow-thick"/>
  
  <!-- Image Buffer Icon -->
  <g transform="translate(740, 80)">
    <circle cx="0" cy="0" r="28" class="icon-circle-data"/>
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-8" y1="-6" x2="8" y2="-6" stroke="#333" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="-8" y1="6" x2="8" y2="6" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="48" class="icon-text">Image</text>
    <text x="0" y="60" class="icon-text">Buffer</text>
  </g>
  
  <!-- ===== AI PROCESSING SECTION ===== -->
  
  <text x="450" y="175" class="section-text" text-anchor="middle">━━━━━━━━━━  AI PROCESSING LAYER  ━━━━━━━━━━</text>
  
  <!-- Arrow down to AI -->
  <line x1="740" y1="118" x2="740" y2="200" class="arrow-thick"/>
  
  <!-- YOLOv8 Detection Icon -->
  <g transform="translate(740, 240)">
    <circle cx="0" cy="0" r="32" class="icon-circle-ai"/>
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="none" stroke="#ec4899" stroke-width="2"/>
    <rect x="-10" y="-8" width="12" height="10" rx="1" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="6" fill="#ec4899"/>
    <text x="0" y="52" class="icon-text" font-weight="bold">YOLOv8</text>
    <text x="0" y="64" class="icon-text">Detection</text>
  </g>
  
  <!-- Arrow to Detect Bananas -->
  <line x1="708" y1="240" x2="658" y2="240" class="arrow"/>
  
  <!-- Detect Bananas Icon -->
  <g transform="translate(620, 240)">
    <circle cx="0" cy="0" r="25" class="icon-circle-ai"/>
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#fde047" stroke="#333" stroke-width="1.5" transform="rotate(-20)"/>
    <rect x="-4" y="-12" width="8" height="4" rx="2" fill="#22c55e"/>
    <text x="0" y="42" class="icon-text">Detect</text>
    <text x="0" y="54" class="icon-text">Bananas</text>
  </g>
  
  <!-- Arrow to Count Fingers -->
  <line x1="595" y1="240" x2="545" y2="240" class="arrow"/>
  
  <!-- Count Fingers Icon -->
  <g transform="translate(510, 240)">
    <circle cx="0" cy="0" r="25" class="icon-circle-ai"/>
    <text x="0" y="5" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">#</text>
    <text x="0" y="42" class="icon-text">Count</text>
    <text x="0" y="54" class="icon-text">Fingers</text>
  </g>
  
  <!-- Arrow to Classify Cultivar -->
  <line x1="485" y1="240" x2="435" y2="240" class="arrow"/>
  
  <!-- Classify Cultivar Icon -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="25" class="icon-circle-ai"/>
    <ellipse cx="-6" cy="-3" rx="8" ry="5" fill="#f59e0b" stroke="#333" stroke-width="1" transform="rotate(-15)"/>
    <ellipse cx="6" cy="3" rx="8" ry="5" fill="#fbbf24" stroke="#333" stroke-width="1" transform="rotate(15)"/>
    <text x="0" y="42" class="icon-text">Classify</text>
    <text x="0" y="54" class="icon-text">Cultivar</text>
  </g>
  
  <!-- Arrow to Determine Ripeness -->
  <line x1="375" y1="240" x2="325" y2="240" class="arrow"/>
  
  <!-- Determine Ripeness Icon -->
  <g transform="translate(290, 240)">
    <circle cx="0" cy="0" r="25" class="icon-circle-ai"/>
    <circle cx="-8" cy="-4" r="5" fill="#22c55e"/>
    <circle cx="0" cy="4" r="5" fill="#eab308"/>
    <circle cx="8" cy="-4" r="5" fill="#ef4444"/>
    <text x="0" y="42" class="icon-text">Determine</text>
    <text x="0" y="54" class="icon-text">Ripeness</text>
  </g>
  
  <!-- Arrow to Calculate Spoilage -->
  <line x1="265" y1="240" x2="215" y2="240" class="arrow"/>
  
  <!-- Calculate Spoilage Icon -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="25" class="icon-circle-ai"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="4" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">📅</text>
    <text x="0" y="42" class="icon-text">Estimate</text>
    <text x="0" y="54" class="icon-text">Spoilage</text>
  </g>
  
  <!-- Arrow to Generate Result -->
  <line x1="155" y1="240" x2="105" y2="240" class="arrow"/>
  
  <!-- Generate Result Icon -->
  <g transform="translate(70, 240)">
    <circle cx="0" cy="0" r="28" class="icon-circle-success"/>
    <polyline points="-12,-2 -6,6 14,-10" stroke="#22c55e" stroke-width="4" fill="none"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">Generate</text>
    <text x="0" y="60" class="icon-text">Result</text>
  </g>
  
  <!-- ===== DATA STORAGE SECTION ===== -->
  
  <text x="450" y="325" class="section-text" text-anchor="middle">━━━━━━━━━━  DATA STORAGE LAYER  ━━━━━━━━━━</text>
  
  <!-- Arrow down from Result to Database -->
  <line x1="70" y1="278" x2="70" y2="350" class="arrow-thick"/>
  
  <!-- SQLite Database Icon -->
  <g transform="translate(70, 390)">
    <circle cx="0" cy="0" r="28" class="icon-circle-data"/>
    <ellipse cx="0" cy="-10" rx="16" ry="6" fill="#f59e0b" stroke="#333" stroke-width="1.5"/>
    <path d="M-16,-10 L-16,8 Q0,18 16,8 L16,-10" fill="none" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="0" cy="8" rx="16" ry="6" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="48" class="icon-text" font-weight="bold">SQLite</text>
    <text x="0" y="60" class="icon-text">Database</text>
  </g>
  
  <!-- Arrow to Store Scan Record -->
  <line x1="108" y1="390" x2="158" y2="390" class="arrow"/>
  
  <!-- Store Scan Record Icon -->
  <g transform="translate(195, 390)">
    <circle cx="0" cy="0" r="25" class="icon-circle-data"/>
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="-5" x2="7" y2="-5" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="1" x2="7" y2="1" stroke="#333" stroke-width="1.5"/>
    <line x1="-7" y1="7" x2="4" y2="7" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="42" class="icon-text">Store Scan</text>
    <text x="0" y="54" class="icon-text">Record</text>
  </g>
  
  <!-- Arrow to Store Images -->
  <line x1="230" y1="390" x2="280" y2="390" class="arrow"/>
  
  <!-- Store Images Icon -->
  <g transform="translate(315, 390)">
    <circle cx="0" cy="0" r="25" class="icon-circle-data"/>
    <rect x="-10" y="-7" width="16" height="12" rx="1.5" fill="none" stroke="#333" stroke-width="1.5"/>
    <polyline points="-8,3 -3,-1 0,2 4,-2 6,1" stroke="#333" stroke-width="1.2" fill="none"/>
    <circle cx="1" cy="-3" r="1.3" fill="#333"/>
    <rect x="-5" y="-11" width="16" height="12" rx="1.5" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="42" class="icon-text">Store</text>
    <text x="0" y="54" class="icon-text">Images</text>
  </g>
  
  <!-- ===== WEB SYNC SECTION ===== -->
  
  <text x="650" y="325" class="section-text" text-anchor="middle">━━━━━━━  WEB SYNC  ━━━━━━━</text>
  
  <!-- Arrow from Database to Web Sync -->
  <path d="M70,418 L70,480 L550,480" class="arrow"/>
  
  <!-- Sync to Web Icon -->
  <g transform="translate(590, 480)">
    <circle cx="0" cy="0" r="28" class="icon-circle"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="0" y="48" class="icon-text">Sync to</text>
    <text x="0" y="60" class="icon-text">Web Server</text>
  </g>
  
  <!-- Arrow to Update Dashboard -->
  <line x1="628" y1="480" x2="678" y2="480" class="arrow"/>
  
  <!-- Update Dashboard Icon -->
  <g transform="translate(715, 480)">
    <circle cx="0" cy="0" r="25" class="icon-circle"/>
    <path d="M0,-14 L14,0 L14,14 L-14,14 L-14,0 Z" fill="#f59e0b"/>
    <rect x="-4" y="2" width="8" height="12" fill="#fff"/>
    <text x="0" y="42" class="icon-text">Update</text>
    <text x="0" y="54" class="icon-text">Dashboard</text>
  </g>
  
  <!-- Arrow to Real-time Display -->
  <line x1="750" y1="480" x2="800" y2="480" class="arrow"/>
  
  <!-- Real-time Display Icon -->
  <g transform="translate(835, 480)">
    <circle cx="0" cy="0" r="25" class="icon-circle-success"/>
    <rect x="-14" y="-10" width="28" height="18" rx="2" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#333" stroke-width="2"/>
    <polyline points="-6,-2 -2,3 8,-5" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="0" y="42" class="icon-text">Real-time</text>
    <text x="0" y="54" class="icon-text">Display</text>
  </g>
  
  <!-- ===== RESULT DATA BOX ===== -->
  <rect x="420" y="345" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="510" y="365" class="icon-text" font-weight="bold" fill="#22c55e">Classification Output</text>
  <text x="510" y="382" class="icon-text" font-size="9">• Cultivar (Lakatan/Latundan/Saba)</text>
  <text x="510" y="394" class="icon-text" font-size="9">• Ripeness (Unripe/Ripe/Overripe)</text>
  <text x="510" y="406" class="icon-text" font-size="9">• Confidence %, Spoilage Days</text>
  <text x="510" y="418" class="icon-text" font-size="9">• Finger Count</text>
  
  <!-- Arrow from Generate Result to Result Box -->
  <path d="M70,268 L70,300 L420,385" class="arrow" stroke-dasharray="5,3"/>
  
  <!-- ===== LEGEND ===== -->
  <g transform="translate(620, 340)">
    <rect x="0" y="0" width="260" height="70" fill="#f9f9f9" stroke="#ddd" rx="5"/>
    <text x="130" y="18" class="icon-text" font-weight="bold">Legend</text>
    <circle cx="25" cy="38" r="10" fill="#dbeafe" stroke="#333" stroke-width="1"/>
    <text x="42" y="42" class="icon-text" text-anchor="start" font-size="9">Hardware</text>
    <circle cx="95" cy="38" r="10" fill="#fce7f3" stroke="#333" stroke-width="1"/>
    <text x="112" y="42" class="icon-text" text-anchor="start" font-size="9">AI/ML</text>
    <circle cx="155" cy="38" r="10" fill="#fef3c7" stroke="#333" stroke-width="1"/>
    <text x="172" y="42" class="icon-text" text-anchor="start" font-size="9">Data</text>
    <circle cx="215" cy="38" r="10" fill="#dcfce7" stroke="#333" stroke-width="1"/>
    <text x="232" y="42" class="icon-text" text-anchor="start" font-size="9">Output</text>
  </g>
  
  <!-- ===== CAPTION ===== -->
  <text x="450" y="535" class="caption-text">Figure 14: Program Workflow for IoT Scanning – Hardware Logic</text>
  
</svg>
